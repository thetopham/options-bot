[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "options-bot"
version = "0.1.0"
description = "Paper-first Alpaca options research and paper trading bot scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alpaca-py>=0.28.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "rich>=13.0",
  "typer>=0.12",
  "duckdb>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
options-bot = "options_bot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
